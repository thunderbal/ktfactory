# no-cni.yml
# ref.: 
# These patch permits to bootstrap a cluster without CNI (by default: flannel).
# A CNI must be installed after etcd bootstrap in order to make the cluster Ready.
# This patch is required to deploy Cilium CNI or other CNI than Flannel.
cluster:
  network:
    cni:
      name: none
  proxy:
    disabled: true
