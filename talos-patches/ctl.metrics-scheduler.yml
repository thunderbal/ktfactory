# metrics-scheduler.yml
# ref.: https://docs.siderolabs.com/talos/v1.13/reference/configuration/v1alpha1/config#scheduler-2
# ref.: https://kubernetes.io/docs/reference/command-line-tools-reference/kube-scheduler/
# These patch exposes Scheduler metric to make Prometheus collector able to scrap.
# By default metrics are exposed on 127.0.0.1 and could not be scrapped by Prometheus.
cluster:
  scheduler:
    extraArgs:
      bind-address: "0.0.0.0"
